<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jolly Search Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      font-size: 1.5rem;
      color: #444;
    }
    .jolly-box {
      background: #f0f8ff;
      border: 2px solid #008080;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .jolly-title {
      font-weight: bold;
      font-size: 1.2rem;
      color: #008080;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #jolly-response {
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h1 id="user-query">Searching...</h1>

  <div class="jolly-box">
    <div class="jolly-title">✨ Jolly's Answer</div>
    <div id="jolly-response">Loading Jolly's cheerful insight...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q');

    if (query) {
      document.getElementById('user-query').textContent = `Results for: "${query}"`;

      fetch(`/.netlify/functions/ask?q=${encodeURIComponent(query)}`)
        .then(res => {
          if (!res.ok) throw new Error("Network response was not ok");
          return res.json();
        })
        .then(data => {
          document.getElementById('jolly-response').textContent = data.answer;
        })
        .catch(err => {
          document.getElementById('jolly-response').textContent = "Oops! Jolly couldn't fetch an answer right now. Please try again later!";
        });
    } else {
      document.getElementById('user-query').textContent = "No search query provided.";
      document.getElementById('jolly-response').textContent = "Please return to the home page and enter a search query.";
    }
  </script>

</body>
</html>
